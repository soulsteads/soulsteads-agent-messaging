name: Container smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      ENGINE: ${{ matrix.engine }}
      IMAGE: localhost/soulsteads-agent-messaging:smoke
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Podman if needed
        if: matrix.engine == 'podman'
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
      - name: Build from source
        run: "$ENGINE build --tag $IMAGE ."
      - name: Check installed image
        run: sh scripts/smoke-container.sh "$ENGINE" "$IMAGE"
